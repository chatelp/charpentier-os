# The three systems and the install key, built, then the key tried from end
# to end in a virtual machine (scripts/test-installer.py): on every pull
# request (the check main requires), and on main.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  installer:
    name: systèmes, clé et essai en VM
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      # The runner has 14 Go free; the systems, the key and its copy need more.
      - name: Disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/local/share/powershell
          sudo docker image prune --all --force >/dev/null
          df -h /

      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - uses: DeterminateSystems/nix-installer-action@v23

      - name: Systems and key
        run: scripts/nix.sh --out dist/installer build --print-build-logs .#installer

      - name: The key, from end to end
        run: nix run .#test-installer

      # D-42: a writing system never takes the development channel, nor the
      # development variant the releases.
      - name: The update channels
        run: nix build --no-link --print-build-logs .#checks.x86_64-linux.update-channels

      - name: Screens
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-installer
          path: dist/test-installer
          if-no-files-found: ignore
